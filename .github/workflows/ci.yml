name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # Always healthy-fast; the sqlite matrix entry simply ignores it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: climax
          POSTGRES_PASSWORD: climax
          POSTGRES_DB: climax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U climax -d climax_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - name: Run tests (SQLite)
        if: matrix.db == 'sqlite'
        working-directory: backend
        run: pytest -q
      - name: Run tests (PostgreSQL)
        if: matrix.db == 'postgres'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://climax:climax@localhost:5432/climax_test
        run: pytest -q

  frontend-test:
    name: Frontend checks (TypeScript + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: climax-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: climax-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Deploy stub — enable when you pick a host. Examples:
  #   - Render / Fly.io: manual deploys from GitHub via repo secrets
  #   - Expo EAS Update: `eas update` from your machine, or a workflow using
  #     expo/expo-github-action with EXPO_TOKEN secrets.EAS_PROJECT_ID.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy (stub — disabled)
    if: false
    needs: [backend-test, frontend-test, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render/fly deploy hook
        run: echo "Add your host's deploy hook here (e.g. curl ${{ secrets.DEPLOY_HOOK_URL }})"