# Full local stack:  docker compose up --build
#   Frontend (nginx)  http://localhost:8080
#   Backend API       http://localhost:8000  (docs at /docs)
#   Postgres          localhost:5432 (climax/climax)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: climax
      POSTGRES_PASSWORD: climax
      POSTGRES_DB: climax
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climax -d climax"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://climax:climax@db:5432/climax
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-all}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@climax.store}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ClimaxAdmin1!}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
